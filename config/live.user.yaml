# Live Trading Service Configuration - User Overrides
# Copy this file and modify only what you need to override

live_trading_service:
  # Enable/disable live trading
  enabled: true

  # Trading capital
  initial_capital: 20000
  
  # Risk management
  risk_per_trade: 0.02
  target_profit_pct: 0.05
  stop_loss_pct: 0.02
  max_holding_days: 7

  # Market hours (IST)
  market_open: "01:00"
  market_close: "15:30"
  
  # Scan interval (seconds)
  scan_time: "01:07"
  trade_time: "00:34"

  # Data refresh intervals (seconds)
  data_refresh_interval: 5
  price_update_interval: 5


  # capital allocation weights for top-ranked buy signals (must sum to 1.0)
  # top 1 gets 50%, top 2 gets 30%, top 3 gets 20%
  position_weights:
    method: "sector_based"
    max_positions: 7
    max_per_sector: 1

    # Weights proportional to sector size (total = ~500 stocks)
    sector_allocation:
      "Financial Services": 0.3
      "Capital Goods": 0.2
      "Healthcare": 0.2
      "Automobile and Auto Components": 0.15
      "Information Technology": 0.0
      "Fast Moving Consumer Goods": 0.15
      "Consumer Services": 0
      "Chemicals": 0
      "Oil Gas & Consumable Fuels": 0
      "Consumer Durables": 0
      "Power": 0.12
      "Metals & Mining": 0
      "Services": 0
      "Construction": 0
      "Construction Materials": 0
      "Realty": 0
      "Telecommunication": 0
      "Textiles": 0
      "Diversified": 0
      "Media Entertainment & Publication": 0
      "Energy": 0
      "Forest Materials": 0



