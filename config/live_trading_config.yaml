live_trading:
  # Market hours (IST - Indian Standard Time)
  market_open: "23:15"      # 9:15 AM
  market_close: "23:59"     # 3:20 PM
  position_refresh_time: "23:47"     # 3:15 PM - refresh state & time exits
  scan_time: "23:49"                 # 3:18 PM - update DB & scan signals

  timezone: "Asia/Kolkata"
  


  # Trading parameters
  initial_capital: 10000
  max_positions: 3
  max_position_size: 5000           # Max capital per position
  risk_per_trade: 0.02              # 2% risk per trade
  
  # Order parameters
  target_profit_pct: 0.05           # 5% profit target
  stop_loss_pct: 0.02               # 2% stop loss
  trailing_stop_pct: 0.01           # 1% trailing stop
  
  # Data refresh intervals
  data_refresh_interval: 5       # seconds (1 minute candlesticks)
  price_update_interval: 5          # seconds (for real-time price checks)
  
  # Strategy selection
  strategy_type: "Volume_Price_Strategy"    # Strategy to use
  strategy_params:
    rsi_period: 14
    oversold: 30
    overbought: 70
    min_improvement: 1.5
    lookback_period: 30
    tolerance_pct: 0.05
  
  # Watchlist for live trading
  watchlist: ["nifty_top_500"]
  
  # Scanning parameters
  scan_symbols: 10                  # Scan top X symbols
  
  # Notifications (Telegram)
  enable_telegram: true
  telegram_chat_id: "YOUR_CHAT_ID"
  telegram_bot_token: "YOUR_BOT_TOKEN"
  
  # Logging
  log_level: "INFO"
  log_file: "logs/live_trading.log"
