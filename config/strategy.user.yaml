# Strategy Service Configuration - User Overrides
# Copy this file and modify only what you need to override

strategy_service:
  # Select which strategy to use for backtest/live trading
  # Options: "SupportResistance", "RSI_WPattern", "MA_Crossover"
  active_strategy: "SupportResistance"
  
  # Enable/disable specific strategies
  enabled_strategies:
    - "SupportResistance"
    - "RSI_WPattern"
    - "MA_Crossover"
