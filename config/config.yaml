# Main configuration file for all services
# Centralized YAML-based configuration

# Broker Service Configuration
broker_service:
  default_broker: "fyers"
  brokers:
    fyers:
      enabled: true
      # Direct credentials (fallback if env vars not set)
      client_id: "8ZU1YKGMVT-200"
      secret_key: "c9YkxN1yj5TEnz1p"
      redirect_uri: "https://www.google.com"
      response_type: "code"
      grant_type: "authorization_code"
      state: "sample_state"
      fyers_id: "YC00531"
      pin: "1234"
      totp_token: "Y3VGJV7N553V5XU6LHWG4ANV67UVTLVP"
      # Environment variable names (preferred method)
      client_id_env: "FYERS_CLIENT_ID"
      secret_key_env: "FYERS_SECRET_KEY"
      access_token_env: "FYERS_ACCESS_TOKEN"

  # Fyers API Configuration
  fyers_api_config:
    base_url: "https://api.fyers.in"
    data_url: "https://api-t1.fyers.in"
    socket_url: "wss://socket.fyers.in"
    symbol_format: "exchange:symbol-series"
    supported_series:
      - "EQ"   # Equity
      - "BE"   # Book Entry
      - "N1"   # Nifty Index
      - "N2"   # Nifty Bank Index
    
    market_data_types:
      - "ohlcv"
      - "depth"
      - "symbols"
    
    timeframes:
      - "1"    # 1 minute
      - "5"    # 5 minutes
      - "15"   # 15 minutes
      - "30"   # 30 minutes
      - "60"   # 60 minutes
      - "D"    # Daily

  # Fyers Stocks Configuration
  fyers_stocks_config:
    api_provider: "Fyers"
    exchange: "NSE"
    market_segment: "NSE Capital Market"
    symbol_format: "NSE:SYMBOL-EQ"

# Data Service Configuration
data_service:
  primary_source: "broker"
  cache_enabled: true
  cache_ttl_seconds: 300
  database:
    enabled: false
    type: "sqlite"
    path: "data/market_data.db"

# Strategy Service Configuration
strategy_service:
  active_strategy: "SupportResistance"
  available_strategies:
    - name: "SupportResistance"
      class: "SupportResistanceStrategy"
      module: "strategies.madam_strategy"
      params:
        volume_ema_period: 20
        volume_threshold: 1.3
        kde_bandwidth: 0.2
        num_levels: 10
    - name: "RSI_WPattern"
      class: "RSIWPatternStrategy"
      module: "strategies.rsi_w_strategy"
      params:
        rsi_period: 14
        rsi_oversold: 30
        rsi_overbought: 70
    - name: "MA_Crossover"
      class: "MovingAverageCrossoverStrategy"
      module: "strategies.crossover_strategy"
      params:
        fast_period: 20
        slow_period: 50

# Backtest Service Configuration
backtest_service:
  initial_capital: 100000
  max_positions: 5
  max_per_sector: 2
  sector_allocation:
    Banking: 0.3
    IT: 0.25
    Energy: 0.15
    Others: 0.3
  redistribute_unused: true

# Optimization Service Configuration
optimization_service:
  default_method: "bayesian"
  bayesian:
    n_iterations: 50
    metric: "sharpe_ratio"
  grid_search:
    metric: "sharpe_ratio"
    parallel_jobs: 4

# Live Trading Service Configuration
live_trading_service:
  enabled: true
  market_hours:
    timezone: "Asia/Kolkata"
    open: "09:15"
    close: "15:30"
  trading_params:
    initial_capital: 20000
    max_positions: 3
    max_position_size: 5000
    risk_per_trade: 0.02
    target_profit_pct: 0.05
    stop_loss_pct: 0.02
  data_refresh_interval: 5
  price_update_interval: 5

# Agent Service (Telegram) Configuration
agent_service:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"
  notifications:
    trade_alerts: true
    pnl_updates: true
    error_alerts: true
    daily_summary: true
  commands:
    - "/start"
    - "/help"
    - "/status"
    - "/positions"
    - "/balance"
    - "/pnl"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/trading_system.log"
  console: true
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5
