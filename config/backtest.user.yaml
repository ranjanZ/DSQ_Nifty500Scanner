# Backtest Service Configuration - User Overrides
backtest:
  strategy_name: "volume_support_resistance_strategy"   # Using random strategy for testing

  start_date: "2025-01-01"          # start of backtesting period
  end_date: "2025-02-01"            # end of backtesting period
  initial_capital: 100000           # ₹1,00,000
  target_profit_pct: 0.08
  stop_loss_pct: 0.04               # 4%
  max_holding_days: 7

  # Max capital that can be allocated per day for new positions
  max_capital_allocation_per_day: 10000  # ₹50,000 max per day

  # Watchlist: nifty_top_500 loads all 500 stocks
  watchlist: ["nifty_top_500"]

  # Capital allocation based on sector
  position_weights:
    method: "sector_based"
    max_positions: 7                # Maximum concurrent positions
    max_per_sector: 1               # Only 1 stock per sector at a time
    sector_allocation:
      "Financial Services": 0.1
      "Capital Goods": 0.1
      "Healthcare": 0.1
      "Automobile and Auto Components": 0.1
      "Information Technology": 0.1
      "Fast Moving Consumer Goods": 0.1
      "Consumer Services": 0.1
      "Chemicals": 0.1
      "Oil Gas & Consumable Fuels": 0.1
      "Consumer Durables": 0.1
      "Power": 0.1
      "Metals & Mining": 0.1
      "Services": 0.1
      "Construction": 0.1
      "Construction Materials": 0.1
      "Realty": 0.1
      "Telecommunication": 0.1
      "Textiles": 0.1
      "Diversified": 0.1
      "Media Entertainment & Publication": 0.1
      "Energy": 0.1
      "Forest Materials": 0.1