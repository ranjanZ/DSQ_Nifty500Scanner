fyers_api_config:
  base_url: "https://api.fyers.in"
  data_url: "https://api-t1.fyers.in"
  socket_url: "wss://socket.fyers.in"
  symbol_format: "exchange:symbol-series"
  supported_series:
    - "EQ"   # Equity
    - "BE"   # Book Entry
    - "N1"   # Nifty Index
    - "N2"   # Nifty Bank Index
  
  market_data_types:
    - "ohlcv"
    - "depth"
    - "symbols"
  
  timeframes:
    - "1"    # 1 minute
    - "5"    # 5 minutes
    - "15"   # 15 minutes
    - "30"   # 30 minutes
    - "60"   # 60 minutes
    - "D"    # Daily
