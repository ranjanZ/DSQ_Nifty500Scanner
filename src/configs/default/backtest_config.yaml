# Backtest Configuration
backtest:
  start_date: "2026-01-01"          # start of backtesting period
  end_date: "2026-06-04"            # end of backtesting period
  initial_capital: 10000
  strategy_name: "Support_Resistance"   # strategy to scan with
  target_profit_pct: 0.08           # 8%
  stop_loss_pct: 0.04               # 4%
  max_holding_days: 7
  
  # Capital allocation weights for top-ranked buy signals
  position_weights:
    method: "sector_based"
    max_positions: 7
    max_per_sector: 1
    # Weights proportional to sector size (total = ~500 stocks)
    sector_allocation:
      "Financial Services": 0.3
      "Capital Goods": 0.2
      "Healthcare": 0.2
      "Automobile and Auto Components": 0.15
      "Information Technology": 0.0
      "Fast Moving Consumer Goods": 0.15
      "Consumer Services": 0
      "Chemicals": 0
      "Oil Gas & Consumable Fuels": 0
      "Consumer Durables": 0
      "Power": 0.12
      "Metals & Mining": 0
      "Services": 0
      "Construction": 0
      "Construction Materials": 0
      "Realty": 0
      "Telecommunication": 0
      "Textiles": 0
      "Diversified": 0
      "Media Entertainment & Publication": 0
      "Energy": 0
      "Forest Materials": 0

  # Days of historical data used for signal generation
  lookback_days: 100
  watchlist: ["nifty_top_500"]
