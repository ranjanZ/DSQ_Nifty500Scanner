# Moving Average Crossover Strategy Configuration
strategy_name: "MA_Crossover"
class_name: "MovingAverageCrossoverStrategy"

# Strategy Parameters
params:
  fast_period: 20
  slow_period: 50
  ma_type: "EMA"  # SMA or EMA
  signal_confirmation: true

# Sector-specific investment allocation for this strategy
sector_allocation:
  Banking:
    enabled: true
    max_positions: 2
    allocation_pct: 0.30
    symbols:
      - "HDFCBANK"
      - "ICICIBANK"
      - "AXISBANK"
  IT:
    enabled: true
    max_positions: 2
    allocation_pct: 0.25
    symbols:
      - "TCS"
      - "INFY"
      - "WIPRO"
  Energy:
    enabled: true
    max_positions: 1
    allocation_pct: 0.15
    symbols:
      - "RELIANCE"
      - "ONGC"
  Others:
    enabled: true
    max_positions: 2
    allocation_pct: 0.30
    symbols:
      - "TATAMOTORS"
      - "SBIN"
      - "LT"
      - "MARUTI"

# Backtest specific settings for this strategy
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 100000
  commission_pct: 0.05
  slippage_pct: 0.01

# Optimization ranges for this strategy
optimization_ranges:
  fast_period: [10, 30]
  slow_period: [40, 100]
  ma_type: ["SMA", "EMA"]

# Live trading overrides (optional)
live_trading:
  max_positions: 3
  risk_per_trade: 0.02
