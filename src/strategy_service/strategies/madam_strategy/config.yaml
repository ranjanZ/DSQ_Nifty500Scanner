# SupportResistance Strategy Configuration
strategy_name: "SupportResistance"
class_name: "SupportResistanceStrategy"

# Strategy Parameters
params:
  volume_ema_period: 20
  volume_threshold: 1.3
  kde_bandwidth: 0.2
  num_levels: 10

# Sector-specific investment allocation for this strategy
sector_allocation:
  Banking:
    enabled: true
    max_positions: 2
    allocation_pct: 0.30
    symbols:
      - "HDFCBANK"
      - "ICICIBANK"
      - "KOTAKBANK"
      - "AXISBANK"
  IT:
    enabled: true
    max_positions: 2
    allocation_pct: 0.25
    symbols:
      - "TCS"
      - "INFY"
      - "HCLTECH"
      - "WIPRO"
  Energy:
    enabled: true
    max_positions: 1
    allocation_pct: 0.15
    symbols:
      - "RELIANCE"
      - "ONGC"
      - "NTPC"
  Others:
    enabled: true
    max_positions: 2
    allocation_pct: 0.30
    symbols:
      - "TATAMOTORS"
      - "SBIN"
      - "LT"

# Backtest specific settings for this strategy
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 100000
  commission_pct: 0.05
  slippage_pct: 0.01

# Optimization ranges for this strategy
optimization_ranges:
  volume_ema_period: [10, 30]
  volume_threshold: [1.0, 2.0]
  kde_bandwidth: [0.1, 0.5]
  num_levels: [5, 20]

# Live trading overrides (optional)
live_trading:
  max_positions: 3
  risk_per_trade: 0.02
